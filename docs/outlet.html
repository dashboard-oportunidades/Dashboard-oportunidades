<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Oportunidades</title>
<meta name="theme-color" content="#ECEFEF">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --ceramica:#ECEFEF;
  --ardosia:#23282B;
  --betume:#8E9899;
  --agua:#0F5468;
  --agua-clara:#CFE0E4;
  --descida:#2F6B4F;
  --linha:#D3D9D9;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --corpo:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ceramica);color:var(--ardosia);
  font-family:var(--corpo);font-size:16px;line-height:1.45;
}
.envolucro{max-width:860px;margin:0 auto;padding:24px 20px 64px}
h1{
  font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;
  letter-spacing:-.02em;margin:0 0 4px;
}
.actualizado{color:var(--betume);font-size:13px;margin:0 0 14px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin:0 0 16px}
.tabs button{
  font:inherit;font-size:14px;font-weight:600;padding:8px 4px;margin-right:16px;
  border:none;border-bottom:2px solid transparent;background:transparent;
  color:var(--betume);cursor:pointer;
}
.tabs button.tab-ativo{color:var(--agua);border-bottom-color:var(--agua)}
.tabs button:focus-visible{outline:2px solid var(--agua);outline-offset:2px}

.filtros-toggle{
  font:inherit;font-size:13px;color:var(--agua);background:none;border:none;
  padding:2px 0;margin:0 0 8px;cursor:pointer;
}
.filtros-painel{margin:0 0 14px}
.filtros-painel[hidden]{display:none}

.filtros{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px}
.filtros button{
  font:inherit;font-size:10px;padding:2px 7px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--linha);background:transparent;color:var(--ardosia);
  cursor:pointer;
}
.filtros button[aria-pressed=true]{background:var(--agua);border-color:var(--agua);color:#fff}
.filtros button:focus-visible{outline:2px solid var(--agua);outline-offset:2px}

table{width:100%;border-collapse:collapse;font-size:15px}
thead th{
  text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--betume);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--linha);
  cursor:pointer;user-select:none;
}
thead th:hover{color:var(--ardosia)}
thead th.ativo{color:var(--agua)}
tbody tr{border-bottom:1px solid var(--linha)}
tbody tr:hover{background:var(--agua-clara)}
td{padding:12px 10px;vertical-align:top}
.preco{
  font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em;
  white-space:nowrap;color:var(--agua);font-variant-numeric:tabular-nums;
}
.nome{max-width:340px}
.nome a{color:inherit;text-decoration:none}
.nome a:hover{text-decoration:underline}
.dim{
  display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;
  border:1px solid var(--linha);color:var(--betume);margin-left:6px;vertical-align:1px;
}
.lojas{font-size:13px;color:var(--betume);line-height:1.5}
.lojas b{font-weight:600;color:var(--ardosia)}
.antes{color:var(--betume);font-weight:400}
.desconto-col{
  font-family:var(--display);font-weight:700;font-size:15px;color:var(--descida);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.vazio{padding:40px 10px;text-align:center;color:var(--betume)}
.quando{font-size:13px;color:var(--betume);white-space:nowrap}
.evolucao{margin-top:6px;display:block;height:22px;width:100%;max-width:140px;overflow:visible}

select.loja{
  font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--linha);background:#fff;color:var(--ardosia);
}
</style>
</head>
<body>
<div class="envolucro">
  <h1>Dashboard de Oportunidades</h1>

  <div class="tabs" id="tabs">
    <button class="tab-ativo" data-tab="base-duche">Base Duche</button>
    <button data-tab="monosplit">Ar Condicionado</button>
    <button data-tab="termoacumuladores">Termoacumuladores</button>
    <button data-tab="frontal-duche">Frontal Duche</button>
    <button data-tab="pavimentos">Pavimentos</button>
  </div>

  <div class="tab-painel" id="tab-base-duche">
    <p class="actualizado" id="actualizado">A carregar…</p>

    <button class="filtros-toggle" id="filtrosToggle">Filtros ▾</button>
    <div class="filtros-painel" id="filtrosPainel" hidden>
      <div class="filtros" id="filtrosDim"></div>
      <div class="filtros" id="filtrosDistrito"></div>
      <div class="filtros">
        <select class="loja" id="filtroLoja"><option value="todas">Todas as lojas</option></select>
      </div>
    </div>

    <div id="conteudo"></div>
  </div>
</div>

<script>
const fmt = n => n.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const el = id => document.getElementById(id);

const TABS = [
  { id: 'base-duche', file: 'outlet.json' },
  { id: 'monosplit', file: 'monosplit.json' },
  { id: 'termoacumuladores', file: 'termoacumuladores.json' },
  { id: 'frontal-duche', file: 'frontal_duche.json' },
  { id: 'pavimentos', file: 'pavimentos.json' },
];

let abaAtiva = 'base-duche';
const estados = {};  // um por separador: { dados, dimensoesAtivas, lojaAtiva, distritosAtivos, ordem }

function novoEstado(){
  return {
    dados: null,
    dimensoesAtivas: new Set(),
    lojaAtiva: 'todas',
    distritosAtivos: new Set(),
    ordem: { campo: 'preco_final', asc: true },
  };
}

function estadoAtual(){
  if (!estados[abaAtiva]) estados[abaAtiva] = novoEstado();
  return estados[abaAtiva];
}

function mudarAba(id){
  abaAtiva = id;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('tab-ativo', b.dataset.tab === id));
  const e = estadoAtual();
  if (e.dados){ montarFiltros(); desenhar(); return; }
  carregarDados(id);
}

function carregarDados(id){
  const tab = TABS.find(t => t.id === id);
  const e = estadoAtual();
  el('actualizado').textContent = 'A carregar…';
  el('conteudo').innerHTML = '';
  fetch(tab.file + '?' + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      e.dados = d;
      const quando = new Date(d.generated);
      el('actualizado').textContent = 'Atualizado ' + quando.toLocaleString('pt-PT',
        {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}) +
        ` · ${d.products.length} produtos`;
      montarFiltros();
      desenhar();
    })
    .catch(err => {
      el('actualizado').textContent = '';
      el('conteudo').innerHTML = '<div class="vazio">Ainda não há dados para este separador.</div>';
      console.error(err);
    });
}

document.querySelectorAll('#tabs button').forEach(b => {
  b.onclick = () => mudarAba(b.dataset.tab);
});

/* '70x160' e '160x70' sao a mesma medida -- canonicaliza maior x menor. */
function dimCanonica(dim){
  if (!dim) return dim;
  const partes = dim.split('x').map(Number);
  if (partes.length !== 2 || partes.some(isNaN)) return dim;
  return `${Math.max(...partes)}x${Math.min(...partes)}`;
}

function dimensoes(produtos){
  const s = new Set();
  produtos.forEach(p => { if (p.dimensao) s.add(dimCanonica(p.dimensao)); });
  return [...s].sort((a, b) => {
    const na = parseInt(a, 10), nb = parseInt(b, 10);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return a.localeCompare(b);
  });
}

function lojas(produtos){
  const s = new Set();
  produtos.forEach(p => p.prices.forEach(x => s.add(x.store)));
  return [...s].sort();
}

function distritos(produtos){
  const s = new Set();
  produtos.forEach(p => p.prices.forEach(x => { if (x.region) s.add(x.region); }));
  return [...s].sort();
}

function montarFiltros(){
  const e = estadoAtual();
  const dims = dimensoes(e.dados.products);
  const alvo = el('filtrosDim');
  alvo.innerHTML = '';
  dims.forEach(d => {
    const b = document.createElement('button');
    b.textContent = d;
    b.setAttribute('aria-pressed', e.dimensoesAtivas.has(d));
    b.onclick = () => {
      if (e.dimensoesAtivas.has(d)) e.dimensoesAtivas.delete(d);
      else e.dimensoesAtivas.add(d);
      b.setAttribute('aria-pressed', e.dimensoesAtivas.has(d));
      desenhar();
    };
    alvo.appendChild(b);
  });

  const alvoDist = el('filtrosDistrito');
  alvoDist.innerHTML = '';
  distritos(e.dados.products).forEach(dist => {
    const b = document.createElement('button');
    b.textContent = dist;
    b.setAttribute('aria-pressed', e.distritosAtivos.has(dist));
    b.onclick = () => {
      if (e.distritosAtivos.has(dist)) e.distritosAtivos.delete(dist);
      else e.distritosAtivos.add(dist);
      b.setAttribute('aria-pressed', e.distritosAtivos.has(dist));
      desenhar();
    };
    alvoDist.appendChild(b);
  });

  const selLoja = el('filtroLoja');
  selLoja.innerHTML = '<option value="todas">Todas as lojas</option>' +
    lojas(e.dados.products).map(l => `<option value="${l}">${l}</option>`).join('');
  selLoja.value = e.lojaAtiva;
  selLoja.onchange = () => { e.lojaAtiva = selLoja.value; desenhar(); };
}

function atualizarBotaoFiltros(){
  const e = estadoAtual();
  const ativos = e.dimensoesAtivas.size + e.distritosAtivos.size + (e.lojaAtiva !== 'todas' ? 1 : 0);
  const painel = el('filtrosPainel');
  const rotulo = ativos > 0 ? `Filtros (${ativos})` : 'Filtros';
  el('filtrosToggle').textContent = rotulo + (painel.hidden ? ' ▾' : ' ▴');
}

el('filtrosToggle').onclick = () => {
  el('filtrosPainel').hidden = !el('filtrosPainel').hidden;
  atualizarBotaoFiltros();
};

function ordenarPor(campo){
  const e = estadoAtual();
  if (e.ordem.campo === campo) e.ordem.asc = !e.ordem.asc;
  else { e.ordem.campo = campo; e.ordem.asc = true; }
  desenhar();
}

/* Mini-grafico da evolucao do preco final; so aparece se houver mudanca. */
function evolucao(hist){
  if (!hist || hist.length < 2) return '';
  const vals = hist.map(h => h[1]);
  const min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < 0.01) return '';
  const w = 140, alt = 22, n = hist.length;
  const pts = hist.map((ponto, i) => {
    const x = n === 1 ? 0 : (i / (n - 1)) * w;
    const y = alt - 3 - ((ponto[1] - min) / (max - min)) * (alt - 6);
    return [x, y];
  });
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const desceu = vals[vals.length - 1] < vals[0];
  return `<svg class="evolucao" viewBox="0 0 ${w} ${alt}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${desceu ? 'var(--descida)' : 'var(--betume)'}" stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function desenhar(){
  atualizarBotaoFiltros();
  const e = estadoAtual();
  let lista = e.dados.products
    .filter(p => e.dimensoesAtivas.size === 0 || e.dimensoesAtivas.has(dimCanonica(p.dimensao)))
    .map(p => {
      let precos = p.prices;
      if (e.distritosAtivos.size > 0) precos = precos.filter(x => e.distritosAtivos.has(x.region));
      if (e.lojaAtiva !== 'todas') precos = precos.filter(x => x.store === e.lojaAtiva);
      if (!precos.length) return null;
      precos = [...precos].sort((a, b) => a.preco_final - b.preco_final);
      return {
        ...p,
        prices: precos,
        preco_final: precos[0].preco_final,
        preco_desconto: precos[0].preco_desconto,
      };
    })
    .filter(Boolean);

  lista = [...lista].sort((a, b) => {
    let va = a[e.ordem.campo], vb = b[e.ordem.campo];
    if (e.ordem.campo === 'name') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return e.ordem.asc ? -1 : 1;
    if (va > vb) return e.ordem.asc ? 1 : -1;
    return 0;
  });

  if (!lista.length){
    el('conteudo').innerHTML = '<div class="vazio">Sem produtos para este filtro.</div>';
    return;
  }

  const linhaLoja = x => {
    const temDesconto = x.preco_desconto > 0;
    const detalhe = temDesconto
      ? `${fmt(x.preco_final)} <span class="antes">(era ${fmt(x.preco_normal)}, -${fmt(x.preco_desconto)})</span>`
      : fmt(x.preco_final);
    return `${x.store}: ${detalhe}`;
  };

  const dataCurta = iso => new Date(iso).toLocaleDateString('pt-PT', {day:'numeric', month:'short'});

  const linhas = lista.map(p => {
    const mostrar = p.prices.slice(0, 3);
    const resto = p.prices.length - mostrar.length;
    const lojasTxt = mostrar
      .map((x, i) => i === 0 ? `<b>${linhaLoja(x)}</b>` : linhaLoja(x))
      .join(' · ') + (resto > 0 ? ` · mais ${resto}` : '');
    const dimBadge = p.dimensao ? `<span class="dim">${dimCanonica(p.dimensao)}</span>` : '';
    const melhor = p.prices[0];
    const descontoTxt = p.preco_desconto > 0 ? `-${fmt(p.preco_desconto)}` : '—';
    return `<tr>
      <td class="preco">${fmt(p.preco_final)}</td>
      <td class="desconto-col">${descontoTxt}</td>
      <td class="nome"><a href="${p.url}" target="_blank" rel="noopener">${p.name}</a>${dimBadge}
        ${evolucao(melhor.history)}</td>
      <td class="lojas">${lojasTxt}</td>
      <td class="quando">${dataCurta(melhor.atualizado)}</td>
    </tr>`;
  }).join('');

  const seta = campo => e.ordem.campo === campo ? (e.ordem.asc ? ' ▲' : ' ▼') : '';
  el('conteudo').innerHTML = `<table>
    <thead><tr>
      <th class="${e.ordem.campo==='preco_final'?'ativo':''}" onclick="ordenarPor('preco_final')">Preço${seta('preco_final')}</th>
      <th class="${e.ordem.campo==='preco_desconto'?'ativo':''}" onclick="ordenarPor('preco_desconto')">Desconto${seta('preco_desconto')}</th>
      <th class="${e.ordem.campo==='name'?'ativo':''}" onclick="ordenarPor('name')">Produto${seta('name')}</th>
      <th>Lojas</th>
      <th>Visto em</th>
    </tr></thead>
    <tbody>${linhas}</tbody>
  </table>`;
}

carregarDados('base-duche');
</script>
</body>
</html>
