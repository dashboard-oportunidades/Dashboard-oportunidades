name: Monitor bases de duche

on:
  schedule:
    # 07:00 UTC = 08:00 em Lisboa no horário de verão, 07:00 no de inverno
    - cron: "0 7 * * *"
  workflow_dispatch:        # permite correr à mão a partir do separador Actions

permissions:
  contents: write           # necessário para guardar o state.json

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar preços
        env:
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Guardar histórico e atualizar a página
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --quiet --cached || git commit -m "Preços de $(date -u +%Y-%m-%d)"
          git push
